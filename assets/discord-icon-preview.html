<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Discord Icon Preview | TED-OCC</title>
<style>
  body {
    background: #0d1117;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    margin: 0;
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  .row {
    display: flex;
    align-items: center;
    gap: 3rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }
  .preview-label {
    font-size: 0.8rem;
    color: #94a3b8;
  }
  .circle-mask {
    border-radius: 50%;
    overflow: hidden;
    background: #2b2d31;
    padding: 4px;
  }
  .size-128 { width: 128px; height: 128px; }
  .size-64 { width: 64px; height: 64px; }
  .size-32 { width: 32px; height: 32px; }
  button {
    background: #f59e0b;
    color: #111827;
    border: none;
    padding: 0.8rem 1.8rem;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #fbbf24; }
  .note {
    color: #94a3b8;
    font-size: 0.85rem;
    max-width: 520px;
    text-align: center;
    line-height: 1.7;
  }
  canvas { display: none; }
</style>
</head>
<body>

<h1>Discord Icon Preview (TED-OCC)</h1>

<div class="row">
  <div class="preview">
    <div class="preview-label">原寸（512×512, 角丸）</div>
    <img id="icon512" src="discord-icon.svg" width="256" height="256" alt="icon">
  </div>

  <div class="preview">
    <div class="preview-label">Discord 表示（128）</div>
    <div class="circle-mask size-128">
      <img src="discord-icon.svg" width="120" height="120" alt="icon">
    </div>
  </div>

  <div class="preview">
    <div class="preview-label">Discord 表示（64）</div>
    <div class="circle-mask size-64">
      <img src="discord-icon.svg" width="56" height="56" alt="icon">
    </div>
  </div>

  <div class="preview">
    <div class="preview-label">サイドバー（32）</div>
    <div class="circle-mask size-32">
      <img src="discord-icon.svg" width="24" height="24" alt="icon">
    </div>
  </div>
</div>

<button id="download">PNG でダウンロード（512×512）</button>

<p class="note">
  「PNG でダウンロード」ボタンを押すと <code>ted-occ-discord-icon.png</code> が保存されます。<br>
  このファイルを Discord サーバ設定 → サーバープロフィール → アイコン変更 からアップロードしてください。
</p>

<canvas id="canvas" width="512" height="512"></canvas>

<script>
  document.getElementById('download').addEventListener('click', async () => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const response = await fetch('discord-icon.svg');
    const svgText = await response.text();
    const blob = new Blob([svgText], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, 512, 512);
      ctx.drawImage(img, 0, 0, 512, 512);
      URL.revokeObjectURL(url);

      canvas.toBlob((pngBlob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(pngBlob);
        a.download = 'ted-occ-discord-icon.png';
        a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    };
    img.src = url;
  });
</script>

</body>
</html>
