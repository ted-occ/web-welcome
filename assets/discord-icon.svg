<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGradient)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#highlight)"/>

  <text x="256" y="256"
        font-family="Inter, 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif"
        font-weight="900"
        font-size="180"
        fill="#ffffff"
        text-anchor="middle"
        dominant-baseline="central"
        letter-spacing="-4">TED</text>
</svg>
